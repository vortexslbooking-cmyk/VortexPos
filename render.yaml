# Despliegue de un clic en Render — https://render.com
# 1) Sube esta carpeta "server" a un repositorio de GitHub.
# 2) En Render: New > Blueprint > elige el repo. Render lee este archivo y crea todo:
#    el servicio web + una base de datos Postgres gestionada, ya conectados.
# 3) Cuando termine, entra en el panel en la URL que te da Render.

services:
  - type: web
    name: vortexpos-cloud
    runtime: docker
    plan: free                      # sube a "starter" cuando tengas clientes
    healthCheckPath: /health
    envVars:
      # La base de datos ya NO la gestiona Render. El Postgres gratuito de Render
      # caduca a los 30 días de crearse y se borra; el de Neon no caduca. Como no
      # hay ingresos todavía, se decidió (10-08-2026) no pagar hosting de base de
      # datos hasta tener el primer cliente.
      #
      # El valor se pone A MANO en el panel de Render (Environment → DATABASE_URL)
      # con la cadena de conexión de Neon, que termina en "?sslmode=require".
      #
      # CUANDO ENTRE EL PRIMER CLIENTE, hay que revisar esto: el plan gratuito de
      # Neon da 100 CU-hora al mes y un bar con el POS abierto en horario de
      # servicio se come casi todas. Si se agotan, la base se suspende hasta el
      # mes siguiente — y eso pasaría a mitad de servicio, sin avisar.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET             # se genera una clave segura automáticamente
        generateValue: true
      - key: PROVIDER_EMAIL
        sync: false                 # lo defines tú en el panel de Render (tu email)
      - key: PROVIDER_PASSWORD
        sync: false                 # lo defines tú en el panel de Render (contraseña fuerte)

# Aquí había una base de datos Postgres gestionada por Render. Se quitó el
# 10-08-2026: su plan gratuito caduca a los 30 días de crearse y después se
# borra con todo dentro. Ahora el Postgres vive en Neon, cuyo plan gratuito es
# permanente, y Render solo conoce la cadena de conexión.
#
# La copia de seguridad diaria cifrada (.github/workflows/backup-diario.yml)
# sigue siendo la red de verdad, y no depende de quién aloje la base. Con
# cualquier proveedor, esa copia es lo único que garantiza que el trabajo
# comercial no se pierde. Ver README, sección "Copias".
