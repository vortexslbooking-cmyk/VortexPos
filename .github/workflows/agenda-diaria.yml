# Correo de agenda cada mañana.
#
# Cada día a primera hora entra en el panel, pide las tareas de HOY (más las
# atrasadas y un adelanto de mañana) y las envía por correo usando Web3Forms
# (el mismo servicio que ya usa el formulario de la web). El texto lo redacta
# el propio servidor (endpoint /api/provider/agenda-correo); aquí solo se envía.
#
# El correo llega a la bandeja asociada a tu clave de Web3Forms
# (vortex.s.l.booking@gmail.com). Desde ahí lo lees o se lo reenvías a tu socio.
#
# ── Secretos que añades tú una vez en GitHub ─────────────────────────────────
# Settings → Secrets and variables → Actions → New repository secret:
#   PROVIDER_EMAIL      el email del panel (el mismo que ya usas para el backup)
#   PROVIDER_PASSWORD   la contraseña del panel (la misma que ya usas para el backup)
#   WEB3FORMS_KEY       tu "access key" de Web3Forms (la misma de la web de contacto).
#
# Los dos primeros ya existen si configuraste el backup: se reutilizan.
# Sin WEB3FORMS_KEY el envío se salta con un aviso claro (no falla en rojo) y
# deja en el registro una vista previa de lo que se habría enviado.
# (Los secretos MAIL_USERNAME / SOCIO_EMAIL de la vía SMTP ya no se usan: puedes
#  dejarlos o borrarlos, da igual.)
# ─────────────────────────────────────────────────────────────────────────────

name: Agenda diaria por correo

on:
  schedule:
    - cron: "0 6 * * *"       # todos los días a las 06:00 UTC (08:00 en España en verano)
  workflow_dispatch:           # permite lanzarla a mano desde la pestaña Actions

jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar el correo de hoy (desde el panel)
        id: prep
        env:
          URL: https://vortexpos-cloud.onrender.com
          EMAIL: ${{ secrets.PROVIDER_EMAIL }}
          PASSWORD: ${{ secrets.PROVIDER_PASSWORD }}
          KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: |
          set -euo pipefail
          # ¿Está el envío configurado? Se decide aquí (los secrets no se leen con
          # fiabilidad dentro de un "if:") y se pasa como salida.
          if [ -n "${KEY:-}" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

          FALTAN=""
          [ -z "${EMAIL:-}" ]    && FALTAN="$FALTAN PROVIDER_EMAIL"
          [ -z "${PASSWORD:-}" ] && FALTAN="$FALTAN PROVIDER_PASSWORD"
          if [ -n "$FALTAN" ]; then
            echo "Faltan secretos:$FALTAN (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          echo "Entrando en el panel (el servidor gratuito puede tardar ~50 s en despertar)…"
          BODY=$(python3 -c 'import json,os; print(json.dumps({"email":os.environ["EMAIL"].strip(),"password":os.environ["PASSWORD"].strip()}))')
          RESP=$(curl -sS --max-time 150 -w "\n%{http_code}" -X POST "$URL/api/provider/login" \
                    -H "Content-Type: application/json" -d "$BODY")
          CODIGO=$(echo "$RESP" | tail -n1)
          CUERPO=$(echo "$RESP" | sed '$d')
          echo "Login: HTTP $CODIGO"
          TOKEN=$(printf '%s' "$CUERPO" | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          if [ -z "$TOKEN" ]; then
            echo "No se pudo entrar en el panel (HTTP $CODIGO)."
            [ "$CODIGO" = "401" ] && echo "401 = email o contrasena incorrectos (los mismos del backup)."
            [ "$CODIGO" = "429" ] && echo "429 = demasiados intentos, reintenta en un minuto."
            exit 1
          fi

          echo "Pidiendo la agenda de hoy…"
          curl -sS --max-time 150 "$URL/api/provider/agenda-correo" \
            -H "Authorization: Bearer $TOKEN" -o agenda.json
          python3 -c 'import json; d=json.load(open("agenda.json")); assert d.get("subject"); print("Agenda lista:", d["subject"])'

      - name: Enviar el correo (Web3Forms)
        if: ${{ steps.prep.outputs.send == 'true' }}
        env:
          KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          d = json.load(open("agenda.json"))
          payload = {
              "access_key": os.environ["KEY"].strip(),
              "subject": d.get("subject", "Agenda de Vortex"),
              "from_name": "Vortex Agenda",
              "message": d.get("text", "(sin contenido)"),
          }
          req = urllib.request.Request(
              "https://api.web3forms.com/submit",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json", "Accept": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  out = json.loads(r.read().decode())
                  print("Web3Forms:", r.status, out.get("message"))
                  if not out.get("success"):
                      raise SystemExit("Web3Forms devolvió success=false: " + str(out))
                  print("Correo enviado correctamente.")
          except urllib.error.HTTPError as e:
              print("ERROR Web3Forms:", e.code, e.read().decode())
              raise
          PY

      - name: Aviso si falta configurar el correo
        if: ${{ steps.prep.outputs.send == 'false' }}
        run: |
          echo "La agenda se preparó, pero NO se envió: falta el secreto WEB3FORMS_KEY."
          echo "--- Vista previa de lo que se habría enviado ---"
          python3 -c 'import json; d=json.load(open("agenda.json")); print(d["subject"]); print(); print(d["text"])'
